<!doctype html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Manage your DevHaven profile settings">
    <meta name="theme-color" content="#10131a">
    <title>Settings | DevHaven</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/navbar.css">
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <div id="navbar-root"></div>

    <main id="main-content" class="app-main" tabindex="-1">
        <section class="settings-section">
            <header class="settings-header">
                <h1>Settings</h1>
                <p class="settings-description">Manage your profile information</p>
            </header>

            <div id="settings-loader" class="loader-container"></div>
            <div id="settings-error" class="error-container"></div>

            <div class="panel settings-panel">
                <h2>Profile Information</h2>

                <form id="settings-form" class="settings-form">
                    <div class="form-field">
                        <label for="name-input">Display Name</label>
                        <input
                            type="text"
                            id="name-input"
                            name="name"
                            placeholder="Your display name"
                            required
                            autocomplete="name"
                        >
                    </div>

                    <div class="form-field">
                        <label for="bio-input">Bio</label>
                        <textarea
                            id="bio-input"
                            name="bio"
                            rows="4"
                            placeholder="Tell us about yourself"
                        ></textarea>
                    </div>

                    <div class="form-field">
                        <label for="avatar-input">Avatar URL</label>
                        <input
                            type="url"
                            id="avatar-input"
                            name="avatarUrl"
                            placeholder="https://example.com/avatar.jpg"
                            autocomplete="photo"
                        >
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="button" id="save-button">
                            Save Changes
                        </button>
                    </div>
                </form>

                <div id="message-container" class="message-container"></div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <p>DevHaven is a place to share what you learn.</p>
    </footer>

    <script type="module" src="../js/main.js"></script>
    <script type="module" src="../js/pages/settings.js"></script>
</body>
</html>
