<!doctype html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to your DevHaven account">
    <meta name="theme-color" content="#10131a">
    <title>Login | DevHaven</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <div id="navbar-root"></div>

    <main id="main-content" class="app-main auth-container" tabindex="-1">
        <section class="auth-panel panel" aria-labelledby="login-heading">
            <header class="auth-panel__header">
                <h1 id="login-heading" class="auth-panel__heading">Welcome back</h1>
                <p class="auth-panel__subheading">Sign in to your account</p>
            </header>

            <div id="form-message" class="auth-form__message"></div>

            <form id="login-form" class="auth-form" novalidate>
                <div class="auth-form__fields">
                    <div class="form-field">
                        <label for="email">Email</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            autocomplete="email"
                            required
                            aria-required="true"
                        />
                    </div>

                    <div class="form-field">
                        <label for="password">Password</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            autocomplete="current-password"
                            required
                            aria-required="true"
                        />
                    </div>
                </div>

                <div class="auth-form__actions">
                    <button type="submit" class="button auth-form__button">
                        Sign in
                    </button>
                </div>

                <div class="auth-form__links">
                    <p class="auth-form__link-text">
                        Don't have an account? <a href="/pages/register.html">Register</a>
                    </p>
                </div>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <p>DevHaven is a place to share what you learn.</p>
    </footer>

    <script type="module" src="../js/main.js"></script>
    <script type="module" src="../js/pages/login.js"></script>
</body>
</html>
