<!doctype html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create your DevHaven account">
    <meta name="theme-color" content="#10131a">
    <title>Register | DevHaven</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <div id="navbar-root"></div>

    <main id="main-content" class="app-main auth-container" tabindex="-1">
        <section class="auth-panel panel" aria-labelledby="register-heading">
            <header class="auth-panel__header">
                <h1 id="register-heading" class="auth-panel__heading">Join DevHaven</h1>
                <p class="auth-panel__subheading">Create your developer account</p>
            </header>

            <div id="form-message" class="auth-form__message"></div>

            <form id="register-form" class="auth-form" novalidate>
                <div class="auth-form__fields">
                    <div class="form-field">
                        <label for="name">Name</label>
                        <input
                            type="text"
                            id="name"
                            name="name"
                            autocomplete="name"
                            required
                            aria-required="true"
                        />
                    </div>

                    <div class="form-field">
                        <label for="email">Email</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            autocomplete="email"
                            required
                            aria-required="true"
                        />
                    </div>

                    <div class="form-field">
                        <label for="password">Password</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            autocomplete="new-password"
                            minlength="8"
                            required
                            aria-required="true"
                            aria-describedby="password-help"
                        />
                        <span id="password-help" class="auth-form__help-text">
                            Must be at least 8 characters
                        </span>
                    </div>
                </div>

                <div class="auth-form__actions">
                    <button type="submit" class="button auth-form__button">
                        Create account
                    </button>
                </div>

                <div class="auth-form__links">
                    <p class="auth-form__link-text">
                        Already have an account? <a href="/client/pages/login.html">Sign in</a>
                    </p>
                </div>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <p>DevHaven is a place to share what you learn.</p>
    </footer>

    <script type="module" src="../js/main.js"></script>
    <script type="module" src="../js/pages/register.js"></script>
</body>
</html>
