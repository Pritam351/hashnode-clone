<!doctype html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A developer-first publishing platform.">
    <meta name="theme-color" content="#10131a">
    <title>DevHaven | Developer Publishing</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/feed.css">
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <div id="navbar-root"></div>

    <main id="main-content" class="app-main" tabindex="-1">
        <div class="feed-container">
            <header class="feed-header">
                <h1 class="feed-header__title" id="feed-title">Latest Posts</h1>
                <div id="active-tag-container" class="active-tag-container" hidden></div>
                <div class="search-bar">
                    <label for="search-input" class="sr-only">Search posts</label>
                    <input
                        type="search"
                        id="search-input"
                        class="search-bar__input"
                        placeholder="Search posts..."
                        autocomplete="off"
                    >
                    <button
                        id="clear-search"
                        class="search-bar__clear"
                        aria-label="Clear search"
                        hidden
                    >×</button>
                </div>
            </header>

            <div id="posts-container" role="region" aria-live="polite" aria-label="Posts feed">
                <!-- Posts will be rendered here -->
            </div>

            <div id="pagination-container">
                <!-- Pagination will be rendered here -->
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <p>DevHaven is a place to share what you learn.</p>
    </footer>

    <script type="module" src="js/main.js"></script>
</body>
</html>
